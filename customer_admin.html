<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Mijies Cafe</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        .sidebar-brand { padding: 15px 25px; font-size: 24px; font-weight: 700; color: #FEA116; text-align: center; border-bottom: 1px solid #222; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #0F172B; padding-top: 20px; z-index: 999; }
        .sidebar-menu { padding: 0; list-style: none; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: white; text-decoration: none; transition: .3s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: #FEA116; color: black; }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-box { background: white; padding: 25px; border-radius: 18px; box-shadow: 0 0 15px rgba(0,0,0,.08); }
        .btn-add { background: #FEA116; color: black; font-weight: 600; border: none; }
        .table thead { background: #0F172B; color: white; }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-utensils"></i> Mijies Cafe</div>
    <ul class="sidebar-menu">
        <li><a href="admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="customer_admin.html" class="active"><i class="fas fa-users"></i> Customer</a></li>
        <li><a href="staff_admin.html"><i class="fas fa-user-tie"></i> Staff</a></li>
        <li><a href="menu_admin.html"><i class="fas fa-hamburger"></i> Menu</a></li>
        <li><a href="package_admin.html"><i class="fas fa-box"></i> Package</a></li>
        <li><a href="order_admin.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
        <li><a href="payment_admin.html"><i class="fas fa-credit-card"></i> Payment</a></li>
        <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Customer Management</h3>
        <!--<button class="btn btn-add" onclick="addNewCustomer()"><i class="fas fa-user-plus"></i> Add New Customer</button>-->
    </div>

    <div class="card-box">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Cust ID</th>
                        <th>Customer Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Phone No</th>
                        <th>Address</th>
                       <!-- <th class="text-center">Orders</th>--> <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="customerTableBody">
                    <tr>
                        <td colspan="9" class="text-center">Loading registered customers database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadCustomers();
    });

    function loadCustomers() {
        fetch('get_customers.php')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('customerTableBody');
                tableBody.innerHTML = ''; 

                if (data.length === 0 || data.error || data.success === false) {
                    let errorMsg = data.message ? data.message : "No customer entries found.";
                    tableBody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">${errorMsg}</td></tr>`;
                    return;
                }

                data.forEach(cust => {
                    // Penyelarasan data fallback nilai kosong/null
                    let nameDisplay = cust.custName ? cust.custName : 'N/A';
                    let phoneDisplay = cust.custPhoneNo ? cust.custPhoneNo : '<span class="text-muted">N/A</span>';
                    let emailDisplay = cust.custEmail ? cust.custEmail : '<span class="text-muted">N/A</span>';
                    let usernameDisplay = cust.custUsername ? cust.custUsername : '<span class="text-muted">N/A</span>';
                    let passwordDisplay = cust.custPassword ? cust.custPassword : '<span class="text-muted">N/A</span>';
                    let addressDisplay = cust.custAddress ? cust.custAddress : '<span class="text-muted">N/A</span>';
                    <!--let totalOrders = cust.total_orders ? cust.total_orders : 0;-->

          
                    let row = `
                        <tr>
                            <td><b>#CST-${String(cust.custID).padStart(3, '0')}</b></td>
                            <td>${nameDisplay}</td>
                            <td><small>${emailDisplay}</small></td>
                            <td><span class="text-success fw-bold">${usernameDisplay}</span></td>
                            <td><code class="text-dark">${passwordDisplay}</code></td>
                            <td>${phoneDisplay}</td>
                            <td>
                                <span class="text-muted small" style="display:block; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${addressDisplay}">
                                    ${addressDisplay}
                                </span>
                            </td>
                           
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCustomer('${cust.custID}')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error fetching customer data:', error);
                document.getElementById('customerTableBody').innerHTML = `<tr><td colspan="9" class="text-center text-danger">Failed to gather active accounts. Check XAMPP Control Panel.</td></tr>`;
            });
    }

    function deleteCustomer(id) {
        if (confirm("Are you sure you want to delete Customer ID: " + id + "?")) {
            
            
            fetch('delete_customer.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message); 
                    loadCustomers();     
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error deleting customer:', error);
                alert("Failed to delete.");
            });
            
        }
    }
</script>

</body>
</html>
