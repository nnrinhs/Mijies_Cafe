<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management - Mijies Cafe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #FEA116; --dark: #0F172B; --light: #F1F8FF; }
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
		.sidebar-brand { padding: 15px 25px; font-size: 24px; font-weight: 700; color: #FEA116; text-align: center; border-bottom: 1px solid #222; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #0F172B; padding-top: 20px; z-index: 999; }
        .sidebar-menu { padding: 0; list-style: none; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: white; text-decoration: none; transition: .3s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: #FEA116; color: black; }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-box { background: white; padding: 25px; border-radius: 18px; box-shadow: 0 0 15px rgba(0,0,0,.08); }
        .btn-add { background: #FEA116; color: black; font-weight: 600; border: none; }
        .table thead { background: #0F172B; color: white; }
        .price-text { font-weight: bold; color: #0F172B; }
        .package-name { color: #FEA116; font-weight: 700; }
        
        /* Penyelarasan Warna Lencana Keseluruhan Sistem */
        .badge-cash { background: #e1f7ec; color: #155724; padding: 6px 12px; border-radius: 30px; font-weight: 600; font-size: 13px; display: inline-block; }
        .badge-online { background: #fff8ee; color: #e08e12; padding: 6px 12px; border-radius: 30px; font-weight: 600; font-size: 13px; display: inline-block; cursor: pointer; border: 1px solid var(--primary); transition: 0.2s; }
        .badge-online:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-utensils"></i> Mijies Cafe</div>
    <ul class="sidebar-menu">
        <li><a href="admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="customer_admin.html"><i class="fas fa-users"></i> Customer</a></li>
        <li><a href="staff_admin.html"><i class="fas fa-user-tie"></i> Staff</a></li>
        <li><a href="menu_admin.html"><i class="fas fa-hamburger"></i> Menu</a></li>
        <li><a href="package_admin.html"><i class="fas fa-box"></i> Package</a></li>
        <li><a href="order_admin.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
        <li><a href="payment_admin.html" class="active"><i class="fas fa-credit-card"></i> Payment</a></li>
        <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: #0F172B;">Transaction & Payment Records</h2>
        <button class="btn btn-warning fw-bold text-white" onclick="fetchPayments()"><i class="fas fa-sync"></i> Refresh Data</button>
    </div>

    <div class="card card-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Order ID</th>
                        <th>Proof (QR/Cash)</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="paymentTableBody">
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                            <div class="spinner-border text-warning spinner-border-sm me-2"></div> Loading records...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", fetchPayments);

    function fetchPayments() {
        fetch('get_payments.php')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('paymentTableBody');
                tableBody.innerHTML = ''; 

                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No transactions recorded yet.</td></tr>`;
                    return;
                }

                data.forEach(payment => {
                    let proofText = payment.paymentProof ? payment.paymentProof.trim() : '';
                    let proofLower = proofText.toLowerCase();

                    let isCash = proofLower.includes('cash') || proofText === '';
                    
                    let proofContent = '';
                    if (isCash) {
                        proofContent = `<span class="badge badge-cash"><i class="fas fa-money-bill-wave"></i> Cash</span>`;
                    } else {
                        proofContent = `
                            <span class="badge badge-online" onclick="viewReceiptImage('${payment.paymentProof}')" title="Click to view transaction proof">
                                <i class="fas fa-qrcode"></i> QR: ${proofText}
                            </span>
                        `;
                    }

                    let row = `
                        <tr>
                            <td><b>#PAY-${payment.paymentID}</b></td>
                            <td><span class="text-muted">#ORD-${payment.orderID}</span></td>
                            <td>${proofContent}</td>
                            <td><i class="far fa-calendar-alt me-1 text-muted"></i> ${payment.paymentDate}</td>
                            <td><b class="text-success">RM ${parseFloat(payment.paymentAmount).toFixed(2)}</b></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('paymentTableBody').innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Failed to load payment stream. Please verify database API connection.</td></tr>`;
            });
    }

    function viewReceiptImage(fileName) {
        if (!fileName) {
            alert("No receipt file recorded.");
            return;
        }

        alert(`Online Transaction Proof Found:\nFile Name: ${fileName}`);
        
    }
</script>

</body>
</html>
