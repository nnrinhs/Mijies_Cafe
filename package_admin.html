<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Management - Mijies Cafe</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        .sidebar-brand { padding: 15px 25px; font-size: 24px; font-weight: 700; color: #FEA116; text-align: center; border-bottom: 1px solid #222; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #0F172B; padding-top: 20px; z-index: 999; }
        .sidebar-menu { padding: 0; list-style: none; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: white; text-decoration: none; transition: .3s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: #FEA116; color: black; }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-box { background: white; padding: 25px; border-radius: 18px; box-shadow: 0 0 15px rgba(0,0,0,.08); }
        .btn-add { background: #FEA116; color: black; font-weight: 600; border: none; }
        .table thead { background: #0F172B; color: white; }
        .price-text { font-weight: bold; color: #0F172B; }
        .package-name { color: #FEA116; font-weight: 700; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-utensils"></i> Mijies Cafe</div>
    <ul class="sidebar-menu">
        <li><a href="admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="customer_admin.html"><i class="fas fa-users"></i> Customer</a></li>
        <li><a href="staff_admin.html"><i class="fas fa-user-tie"></i> Staff</a></li>
        <li><a href="menu_admin.html"><i class="fas fa-hamburger"></i> Menu</a></li>
        <li><a href="package_admin.html" class="active"><i class="fas fa-box"></i> Package</a></li>
        <li><a href="order_admin.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
        <li><a href="payment_admin.html"><i class="fas fa-credit-card"></i> Payment</a></li>
        <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Package Management</h3>
        <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addPackageModal"><i class="fas fa-plus"></i> Add New Package</button>
    </div>

    <div class="card-box">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Package ID</th>
                        <th>Package Name</th>
                        <th>Details (Combo)</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="packageTableBody">
                    <tr>
                        <td colspan="6" class="text-center">Loading packages from database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addPackageModal" tabindex="-1" aria-labelledby="addPackageModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background: #0F172B; color: white;">
                <h5 class="modal-title fw-bold" id="addPackageModalLabel">Add New Package</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addPackageForm" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Package Name</label>
                        <input type="text" class="form-control" name="packageName" required placeholder="Contoh: Package G">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Details (Combo)</label>
                        <input type="text" class="form-control" name="packageDetail" required placeholder="Contoh: Nasi Goreng + Teh Ais">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Price (RM)</label>
                        <input type="number" step="0.01" class="form-control" name="packagePrice" required placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Status</label>
                        <select class="form-select" name="status" required>
                            <option value="Available">Available</option>
                            <option value="Out of Stock">Out of Stock</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Package Image</label>
                        <input type="file" class="form-control" name="packageimage" accept="image/*" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary fw-bold" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning fw-bold" style="background-color: #FEA116; color: black; border: none;">Save Package</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadPackages();

        document.getElementById('addPackageForm').addEventListener('submit', function(e) { 
            e.preventDefault(); 

            const formData = new FormData(this);

            fetch('add_package.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json()) 
            .then(data => { 
                if (data.success) { 
                    alert(data.message); 

                    const addModalElement = document.getElementById('addPackageModal');
                    const addModalInstance = bootstrap.Modal.getInstance(addModalElement);
                    addModalInstance.hide();

                    document.getElementById('addPackageForm').reset();

                    loadPackages(); 
                } else { 
                    alert("Failed to add: " + data.message); 
                } 
            }) 
            .catch(error => { 
                console.error("Error:", error); 
                alert("Error."); 
            }); 
        });
    });

    function loadPackages() {
        fetch('get_packages.php')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('packageTableBody');
                tableBody.innerHTML = ''; 

                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">No packages found in the database.</td></tr>`;
                    return;
                }

                data.forEach(item => {
                    let formattedPrice = item.packagePrice ? parseFloat(item.packagePrice).toFixed(2) : '0.00';
                    let statusValue = item.status ? item.status : 'Available';
                    let badgeClass = statusValue === 'Available' ? 'bg-success' : 'bg-danger';
            
                    let formattedID = `#PKG-${String(item.packageID).padStart(3, '0')}`;
                    
                    let row = `
                        <tr>
                            <td><b>${formattedID}</b></td>
                            <td class="package-name">${item.packageName}</td>
                            <td>${item.packageDetail ? item.packageDetail : 'No details available'}</td>
                            <td class="price-text">RM ${formattedPrice}</td>
                            
                            <td id="package-status-${item.packageID}">
                                <span class="badge ${badgeClass}">${statusValue}</span>
                            </td>
                            
                            <td class="text-center">
                                <button id="edit-btn-${item.packageID}" class="btn btn-sm btn-outline-primary" title="Edit" onclick="editPackageStatus('${item.packageID}', '${statusValue}')">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('packageTableBody').innerHTML = `<tr><td colspan="6" class="text-center text-danger">Failed to connect to database. Check your connection properties.</td></tr>`;
            });
    }

    function editPackageStatus(id, currentStatus) {
        const statusTd = document.getElementById('package-status-' + id);
        if (!statusTd) return;
        if (statusTd.querySelector('select')) return;

        statusTd.innerHTML = `
            <select class="form-select form-select-sm d-inline-block w-auto" onchange="savePackageStatus('${id}', this.value)">
                <option value="Available" ${currentStatus === 'Available' ? 'selected' : ''}>Available</option>
                <option value="Out of Stock" ${currentStatus === 'Out of Stock' ? 'selected' : ''}>Out of Stock</option>
            </select>
        `;
    }

    function savePackageStatus(id, selectedValue) {
        const statusTd = document.getElementById('package-status-' + id);
        if (statusTd) {
            statusTd.innerHTML = `<span class="text-muted"><i class="fas fa-spinner fa-spin"></i> Saving...</span>`;
        }

        const formData = new FormData();
        formData.append('id', id);
        formData.append('status', selectedValue);

        fetch('update_package_status.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.text())
        .then(text => {
            try {
                const result = JSON.parse(text);
                if (result.success) {
                    let badgeClass = selectedValue === 'Available' ? 'badge bg-success' : 'badge bg-danger';
                    statusTd.innerHTML = `<span class="${badgeClass}">${selectedValue}</span>`;
                    
                    const editBtn = document.getElementById('edit-btn-' + id);
                    if (editBtn) {
                        editBtn.setAttribute('onclick', `editPackageStatus('${id}', '${selectedValue}')`);
                    }
                } else {
                    alert("Database Error: " + result.message);
                    loadPackages(); 
                }
            } catch (jsonError) {
                alert("PHP Crash / ERROR: \n\n" + text);
                loadPackages();
            }
        })
        .catch(error => {
            console.error('Network Error:', error);
            alert("Failed to reach server. Please try again.");
            loadPackages();
        });
    }
</script>
</body>
</html>
