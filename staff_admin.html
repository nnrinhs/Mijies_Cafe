<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management - Mijies Cafe</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        .sidebar-brand { padding: 15px 25px; font-size: 24px; font-weight: 700; color: #FEA116; text-align: center; border-bottom: 1px solid #222; }
        .sidebar { position: fixed; top: 0; left: 0; width: 260px; height: 100vh; background: #0F172B; padding-top: 20px; z-index: 999; }
        .sidebar-menu { padding: 0; list-style: none; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 15px; padding: 15px 25px; color: white; text-decoration: none; transition: .3s; }
        .sidebar-menu li a:hover, .sidebar-menu li a.active { background: #FEA116; color: black; }
        .main-content { margin-left: 260px; padding: 30px; }
        .card-box { background: white; padding: 25px; border-radius: 18px; box-shadow: 0 0 15px rgba(0,0,0,.08); }
        .btn-add { background: #FEA116; color: black; font-weight: 600; border: none; }
        .btn-add:hover { background: #e08b10; color: black; }
        .table thead { background: #0F172B; color: white; }
        
        .role-manager { background: #dc3545; color: white; }
        .role-chef { background: #fd7e14; color: white; }
        .role-finance { background: #6f42c1; color: white; }
        .role-assistant { background: #007bff; color: white; }
        .role-ops { background: #198754; color: white; }
        .role-default { background: #6c757d; color: white; }
    </style>
</head>

<body>

<div class="sidebar">
    <div class="sidebar-brand"><i class="fas fa-utensils"></i> Mijies Cafe</div>
    <ul class="sidebar-menu">
        <li><a href="admin.html"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="customer_admin.html"><i class="fas fa-users"></i> Customer</a></li>
        <li><a href="staff_admin.html" class="active"><i class="fas fa-user-tie"></i> Staff</a></li>
        <li><a href="menu_admin.html"><i class="fas fa-hamburger"></i> Menu</a></li>
        <li><a href="package_admin.html"><i class="fas fa-box"></i> Package</a></li>
        <li><a href="order_admin.html"><i class="fas fa-shopping-cart"></i> Orders</a></li>
        <li><a href="payment_admin.html"><i class="fas fa-credit-card"></i> Payment</a></li>
        <li><a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Staff Management</h3>
        <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addStaffModal">
            <i class="fas fa-user-plus"></i> Add New Staff
        </button>
    </div>

    <div class="card-box">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Staff ID</th>
                        <th>Staff Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Password</th>
                        <th>Phone No</th>
                        <th>Address</th>
                        <th>Role Position</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody">
                    <tr>
                        <td colspan="9" class="text-center">Loading registered crew database...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="addStaffModal" tabindex="-1" aria-labelledby="addStaffModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header" style="background: #0F172B; color: white;">
                <h5 class="modal-title" id="addStaffModalLabel"><i class="fas fa-user-plus text-warning"></i> Add New Staff Account</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="addStaffForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Name</label>
                        <input type="text" name="staffName" class="form-content form-control" required placeholder="e.g. Ahmad bin Abu">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Phone Number</label>
                        <input type="text" name="staffPhoneNo" class="form-control" required placeholder="e.g. 0123456789">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Position / Role</label>
                        <select name="staffPosition" class="form-select" required>
                            <option value="" disabled selected>Choose role...</option>
                            <option value="Manager">Manager</option>
                            <option value="Chef">Chef</option>
                            <option value="Financial">Financial / Accountant</option>
                            <option value="Assistant">Assistant</option>
                            <option value="Cashier">Cashier</option>
                            <option value="Steward">Steward</option>
                            <option value="Runner">Runner</option>
							<option value="Demi Chef">Demi Chef</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Email Address</label>
                        <input type="email" name="staffEmail" class="form-control" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">System Username</label>
                        <input type="text" name="staffUsername" class="form-control" required placeholder="username123">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Account Password</label>
                        <input type="password" name="staffPassword" class="form-control" required placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Home Address</label>
                        <textarea name="staffAddress" class="form-control" rows="3" required placeholder="Full residential address..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn style btn-add">Save Staff Entry</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        loadStaff();
    });

    function loadStaff() {
        fetch('staff.php')
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('staffTableBody');
                tableBody.innerHTML = ''; 

                if (data.length === 0 || data.error) {
                    tableBody.innerHTML = `<tr><td colspan="9" class="text-center text-muted">No staff registration entries found.</td></tr>`;
                    return;
                }

                data.forEach(employee => {
                    let position = employee.staffPosition ? employee.staffPosition.trim() : 'Staff';
                    let posLower = position.toLowerCase();
                    let roleBadgeClass = 'role-default';
                    
                    if (posLower.includes('manager')) {
                        roleBadgeClass = 'role-manager'; 
                    } else if (posLower.includes('chef')) {
                        roleBadgeClass = 'role-chef';    
                    } else if (posLower.includes('financial') || posLower.includes('accountant')) {
                        roleBadgeClass = 'role-finance'; 
                    } else if (posLower.includes('assistant')) {
                        roleBadgeClass = 'role-assistant'; 
                    } else if (posLower.includes('cashier') || posLower.includes('steward') || posLower.includes('runner')) {
                        roleBadgeClass = 'role-ops';     
                    }

                    let phoneDisplay = employee.staffPhoneNo ? employee.staffPhoneNo : '<span class="text-muted">N/A</span>';
                    let emailDisplay = employee.staffEmail ? employee.staffEmail : '<span class="text-muted">N/A</span>';
                    let usernameDisplay = employee.staffUsername ? employee.staffUsername : '<span class="text-muted">N/A</span>';
                    let passwordDisplay = employee.staffPassword ? employee.staffPassword : '<span class="text-muted">N/A</span>';
                    let addressDisplay = employee.staffAddress ? employee.staffAddress : '<span class="text-muted">N/A</span>';

                    let row = `
                        <tr>
                            <td><b>#STF-${String(employee.staffID).padStart(3, '0')}</b></td>
                            <td>${employee.staffName}</td>
                            <td><small>${emailDisplay}</small></td>
                            <td><span class="text-primary fw-bold">${usernameDisplay}</span></td>
                            <td><code class="text-dark">${passwordDisplay}</code></td>
                            <td>${phoneDisplay}</td>
                            <td><span class="text-muted small" style="display:block; max-width:150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${addressDisplay}">${addressDisplay}</span></td>
                            <td><span class="badge ${roleBadgeClass}">${position}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-danger" title="Terminate Access" onclick="deleteStaff('${employee.staffID}')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => {
                console.error('Error fetching staff data:', error);
                document.getElementById('staffTableBody').innerHTML = `<tr><td colspan="9" class="text-center text-danger">Failed to gather active accounts. Check XAMPP Control Panel.</td></tr>`;
            });
    }

    document.getElementById('addStaffForm').addEventListener('submit', function(e) { 
        e.preventDefault(); 

        const formData = new FormData(this);

        fetch('add_staff.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json()) 
        .then(data => { 
            if (data.success) { 
                alert(data.message); 

                const addModalElement = document.getElementById('addStaffModal');
                const addModalInstance = bootstrap.Modal.getInstance(addModalElement);
                addModalInstance.hide();

                document.getElementById('addStaffForm').reset();
                loadStaff(); 
            } else { 
                alert("Failed to add: " + data.message); 
            } 
        }) 
        .catch(error => { 
            console.error("Error:", error); 
            alert("Error saving data."); 
        }); 
    });

    function deleteStaff(id) {
        if (confirm("Are you entirely sure you want to revoke system privileges for Staff ID: " + id + "?")) {
            fetch('delete_staff.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message); 
                    loadStaff();         
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error deleting staff:', error);
                alert("Error deleting staff, please check XAMPP.");
            });
        }
    }
</script>

</body>
</html>
